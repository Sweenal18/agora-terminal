name: silver_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-silver"

validations:
  - batch_request:
      datasource_name: duckdb_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: main.silver_equity_ohlcv_daily
    expectation_suite_name: silver_equity_ohlcv

  - batch_request:
      datasource_name: duckdb_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: main.silver_equity_fundamentals
    expectation_suite_name: silver_fundamentals

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      site_names:
        - local_site