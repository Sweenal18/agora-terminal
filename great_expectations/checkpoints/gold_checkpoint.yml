name: gold_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-gold"

validations:
  - batch_request:
      datasource_name: duckdb_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: main_gold.fct_prices
    expectation_suite_name: gold_fct_prices

  - batch_request:
      datasource_name: duckdb_datasource
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: main_gold.dim_instruments
    expectation_suite_name: gold_dim_instruments

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      site_names:
        - local_site