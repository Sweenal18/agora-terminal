<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA - Financial Intelligence Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050810;
    --bg-panel: #080D1A;
    --bg-card: #0C1221;
    --bg-hover: #111828;
    --border: #1A2540;
    --border-bright: #243050;
    --teal: #00D4AA;
    --teal-dim: #00856A;
    --teal-glow: rgba(0, 212, 170, 0.15);
    --blue-accent: #0EA5E9;
    --green: #00E676;
    --red: #FF3D5A;
    --amber: #FFB300;
    --text-primary: #E2E8F4;
    --text-secondary: #7A8BAD;
    --text-dim: #3D4F6E;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Chakra Petch', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(5, 8, 16, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px;
  }
  .nav-left { display: flex; align-items: center; gap: 32px; }
  .logo { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: 0.15em; color: var(--teal); text-shadow: 0 0 20px rgba(0,212,170,0.5); }
  .logo span { color: var(--text-secondary); font-weight: 300; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { font-family: var(--display); font-size: 14px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-secondary); padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; border: 1px solid transparent; text-decoration: none; }
  .nav-link:hover { color: var(--text-primary); background: var(--bg-card); }
  .nav-link.active { color: var(--teal); background: var(--teal-glow); border-color: var(--teal-dim); font-size: 14px; font-weight: 500; letter-spacing: 0.1em; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .live-indicator { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 14px; color: var(--green); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,230,118,0.4); } 50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(0,230,118,0); } }
  .clock { font-family: var(--mono); font-size: 14px; color: var(--text-secondary); letter-spacing: 0.05em; }

  .ticker-wrap { background: var(--bg-panel); border-bottom: 1px solid var(--border); overflow: hidden; height: 34px; display: flex; align-items: center; position: relative; z-index: 1; }
  .ticker-wrap::before, .ticker-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2; }
  .ticker-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg-panel), transparent); }
  .ticker-wrap::after { right: 0; background: linear-gradient(-90deg, var(--bg-panel), transparent); }
  .ticker-track { display: flex; gap: 0; animation: ticker-scroll 60s linear infinite; white-space: nowrap; }
  @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; font-family: var(--mono); font-size: 14px; border-right: 1px solid var(--border); }
  .ticker-sym { font-weight: 600; color: var(--text-primary); letter-spacing: 0.05em; }
  .ticker-price { color: var(--text-secondary); }
  .ticker-chg.pos { color: var(--green); }
  .ticker-chg.neg { color: var(--red); }

  .main { position: relative; z-index: 1; padding: 20px 24px; display: grid; gap: 16px; }

  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-title { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-secondary); }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  .market-status-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .market-status-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; transition: border-color 0.2s; cursor: pointer; }
  .market-status-card:hover { border-color: var(--border-bright); }
  .market-status-card.open { border-left: 3px solid var(--green); }
  .market-status-card.closed { border-left: 3px solid var(--text-dim); }
  .market-status-card.pre { border-left: 3px solid var(--amber); }
  .market-name { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-primary); }
  .market-time { font-family: var(--mono); font-size: 14px; color: var(--text-secondary); margin-top: 3px; }
  .market-badge { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.12em; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; }
  .badge-open { background: rgba(0,230,118,0.12); color: var(--green); border: 1px solid rgba(0,230,118,0.25); }
  .badge-closed { background: rgba(61,79,110,0.2); color: var(--text-dim); border: 1px solid var(--border); }
  .badge-pre { background: rgba(255,179,0,0.12); color: var(--amber); border: 1px solid rgba(255,179,0,0.25); }

  .indices-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .index-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .index-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: transparent; transition: background 0.2s; }
  .index-card:hover { border-color: var(--border-bright); background: var(--bg-hover); }
  .index-card.pos::after { background: var(--green); }
  .index-card.neg::after { background: var(--red); }
  .index-name { font-family: var(--display); font-size: 14px; font-weight: 500; letter-spacing: 0.12em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px; }
  .index-value { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; margin-bottom: 6px; }
  .index-change { font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .index-change.pos { color: var(--green); }
  .index-change.neg { color: var(--red); }
  .index-sparkline { margin-top: 10px; height: 32px; }

  @keyframes flash-green { 0% { background: rgba(0,230,118,0.15); } 100% { background: transparent; } }
  @keyframes flash-red { 0% { background: rgba(255,61,90,0.15); } 100% { background: transparent; } }
  .flash-g { animation: flash-green 0.6s ease-out; }
  .flash-r { animation: flash-red 0.6s ease-out; }

  .middle-row { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
  .heatmap-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: 12px; }
  .heat-cell { aspect-ratio: 1.2; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, filter 0.15s; position: relative; overflow: hidden; }
  .heat-cell:hover { transform: scale(1.08); filter: brightness(1.3); z-index: 2; }
  .heat-cell .cell-sym { font-family: var(--mono); font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 0.02em; }
  .heat-cell .cell-pct { font-family: var(--mono); font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 1px; }

  .macro-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .macro-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .macro-item:last-child { border-bottom: none; }
  .macro-label { font-family: var(--body); font-size: 14px; color: var(--text-secondary); }
  .macro-sublabel { font-family: var(--mono); font-size: 14px; color: var(--text-dim); margin-top: 2px; }
  .macro-value { text-align: right; }
  .macro-num { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .macro-chg { font-family: var(--mono); font-size: 14px; margin-top: 2px; }
  .macro-chg.pos { color: var(--green); }
  .macro-chg.neg { color: var(--red); }
  .macro-chg.neu { color: var(--text-dim); }

  .bottom-row { display: grid; grid-template-columns: 1fr 1fr 380px; gap: 16px; }
  .asset-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .asset-row { display: grid; grid-template-columns: 32px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 5px; cursor: pointer; transition: background 0.15s; }
  .asset-row:hover { background: var(--bg-hover); }
  .asset-rank { font-family: var(--mono); font-size: 14px; color: var(--text-dim); text-align: right; }
  .asset-info { min-width: 0; }
  .asset-sym { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .asset-name { font-size: 14px; color: var(--text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asset-price { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text-primary); text-align: right; }
  .asset-chg { font-family: var(--mono); font-size: 14px; font-weight: 500; text-align: right; padding: 3px 7px; border-radius: 3px; min-width: 64px; }
  .asset-chg.pos { color: var(--green); background: rgba(0,230,118,0.08); }
  .asset-chg.neg { color: var(--red); background: rgba(255,61,90,0.08); }

  .signals-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .signal-item { padding: 12px; border-radius: 5px; border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .signal-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .signal-item.alert::before { background: var(--amber); }
  .signal-item.opportunity::before { background: var(--teal); }
  .signal-item.macro::before { background: var(--blue-accent); }
  .signal-item:hover { border-color: var(--border-bright); background: var(--bg-hover); }
  .signal-tag { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 5px; }
  .signal-tag.alert { color: var(--amber); }
  .signal-tag.opportunity { color: var(--teal); }
  .signal-tag.macro { color: var(--blue-accent); }
  .signal-text { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
  .signal-time { font-family: var(--mono); font-size: 14px; color: var(--text-dim); margin-top: 5px; }

  .search-bar { display: flex; align-items: center; gap: 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 16px; transition: border-color 0.2s; }
  .search-bar:focus-within { border-color: var(--teal-dim); box-shadow: 0 0 0 3px var(--teal-glow); }
  .search-icon { color: var(--text-dim); font-size: 14px; flex-shrink: 0; }
  .search-input { background: transparent; border: none; outline: none; font-family: var(--mono); font-size: 14px; color: var(--text-primary); flex: 1; }
  .search-input::placeholder { color: var(--text-dim); }
  .search-hint { font-family: var(--mono); font-size: 14px; color: var(--text-dim); background: var(--bg-card); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); white-space: nowrap; }

  .forex-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .forex-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; cursor: pointer; transition: all 0.2s; }
  .forex-card:hover { border-color: var(--border-bright); }
  .forex-pair { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.1em; margin-bottom: 6px; }
  .forex-rate { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
  .forex-chg { font-family: var(--mono); font-size: 14px; margin-top: 4px; }
  .forex-chg.pos { color: var(--green); }
  .forex-chg.neg { color: var(--red); }

  .fg-gauge { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 12px; }
  .fg-label { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
  .fg-score { font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--amber); line-height: 1; }
  .vol-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .vol-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--teal-dim), var(--teal)); transition: width 1s ease; }

  .fade-in { opacity: 0; transform: translateY(8px); animation: fadeInUp 0.4s ease forwards; }
  @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.1s; }
  .delay-3 { animation-delay: 0.15s; }
  .delay-4 { animation-delay: 0.2s; }
  .delay-5 { animation-delay: 0.25s; }
  .delay-6 { animation-delay: 0.3s; }

  .search-wrapper { position: relative; z-index: 9999; }
  .search-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-bright); border-radius: 6px; z-index: 9999; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: none; }
  .search-dropdown.visible { display: block; }
  .search-result { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover, .search-result.active { background: var(--bg-hover); }
  .search-result-left { display: flex; align-items: center; gap: 12px; }
  .search-result-sym { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--teal); min-width: 60px; }
  .search-result-name { font-size: 14px; color: var(--text-secondary); }
  .search-result-right { display: flex; align-items: center; gap: 12px; }
  .search-result-price { font-family: var(--mono); font-size: 14px; color: var(--text-primary); }
  .search-result-tag { font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
  .tag-stock { background: rgba(14,165,233,0.12); color: var(--blue-accent); border: 1px solid rgba(14,165,233,0.25); }
  .tag-crypto { background: rgba(0,212,170,0.12); color: var(--teal); border: 1px solid rgba(0,212,170,0.25); }
  .tag-index { background: rgba(255,179,0,0.12); color: var(--amber); border: 1px solid rgba(255,179,0,0.25); }
  .tag-forex { background: rgba(61,79,110,0.2); color: var(--text-secondary); border: 1px solid var(--border); }
  .search-empty { padding: 16px; text-align: center; font-family: var(--mono); font-size: 14px; color: var(--text-dim); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  @media (max-width: 1400px) {
    .indices-grid { grid-template-columns: repeat(3, 1fr); }
    .forex-grid { grid-template-columns: repeat(3, 1fr); }
    .bottom-row { grid-template-columns: 1fr 1fr; }
    .bottom-row .signals-panel { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <div class="logo">AGORA<span> TERMINAL</span></div>
    <div class="nav-links">
      <a href="../market_overview/index.html" class="nav-link active">OVERVIEW</a>
      <a href="../research/index.html" class="nav-link">RESEARCH</a>
      <a href="../screener/index.html" class="nav-link">SCREENER</a>
      <a href="#" class="nav-link">PORTFOLIO</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      LIVE DATA
    </div>
    <div class="clock" id="clock">--:--:-- UTC</div>
    <div id="user-nav" style="display:none;align-items:center;gap:10px;">
      <span id="user-email" style="font-size:14px;color:var(--text-secondary);letter-spacing:0.05em;"></span>
      <button onclick="signOut()" style="font-size:14px;font-weight:500;letter-spacing:0.1em;color:var(--text-secondary);background:none;border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;" onmouseover="this.style.color=`var(--teal)`;this.style.borderColor=`var(--teal-dim)`" onmouseout="this.style.color=`var(--text-secondary)`;this.style.borderColor=`var(--border)`">Sign Out</button>
    </div>
    <div id="signin-nav" style="display:none;">
      <a href="../auth/index.html" style="font-size:14px;font-weight:500;letter-spacing:0.1em;color:var(--teal);border:1px solid var(--teal-dim);border-radius:4px;padding:3px 10px;text-decoration:none;text-transform:uppercase;">Sign In</a>
    </div>
  </div>
</nav>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="main">

  <div class="search-wrapper fade-in">
    <div class="search-bar">
      <span class="search-icon">&#8981;</span>
      <input class="search-input" id="globalSearch" type="text" placeholder="Search any ticker, company, index, or ask a question..." autocomplete="off">
      <span class="search-hint">&#8984;K</span>
    </div>
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>

  <div class="fade-in delay-1">
    <div class="section-header">
      <span class="section-title">Market Status</span>
      <div class="section-line"></div>
    </div>
    <div class="market-status-bar" id="marketStatusBar"></div>
  </div>

  <div class="fade-in delay-2">
    <div class="section-header">
      <span class="section-title">Major Indices</span>
      <div class="section-line"></div>
    </div>
    <div class="indices-grid" id="indicesGrid"></div>
  </div>

  <div class="middle-row fade-in delay-3">
    <div class="heatmap-panel">
      <div class="section-header">
        <span class="section-title">S&amp;P 500 Sector Heatmap</span>
        <div class="section-line"></div>
      </div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
    <div class="macro-panel">
      <div class="section-header">
        <span class="section-title">Macro Pulse</span>
        <div class="section-line"></div>
      </div>
      <div id="macroItems"></div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="asset-panel fade-in delay-4">
      <div class="section-header">
        <span class="section-title">Crypto</span>
        <div class="section-line"></div>
      </div>
      <div id="cryptoList"></div>
    </div>

    <div class="fade-in delay-4">
      <div class="section-header">
        <span class="section-title">Forex</span>
        <div class="section-line"></div>
      </div>
      <div id="forexGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;"></div>
      <div class="section-header" style="margin-top:8px">
        <span class="section-title">Commodities</span>
        <div class="section-line"></div>
      </div>
      <div id="commoditiesGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;"></div>
    </div>

    <div class="signals-panel fade-in delay-5">
      <div class="section-header">
        <span class="section-title">AI Market Signals</span>
        <div class="section-line"></div>
      </div>
      <div id="signalsList"></div>
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
        <div class="section-header">
          <span class="section-title">Fear &amp; Greed Index</span>
          <div class="section-line"></div>
        </div>
        <div class="fg-gauge">
          <div class="fg-score" id="fgScore">--</div>
          <div class="fg-label" id="fgLabel" style="color:var(--amber)">--</div>
          <div style="width:100%;margin-top:12px;">
            <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--text-dim);margin-bottom:4px;">
              <span>FEAR</span><span>NEUTRAL</span><span>GREED</span>
            </div>
            <div class="vol-bar" style="height:8px;">
              <div class="vol-fill" id="fgFill" style="width:50%;background:linear-gradient(90deg,var(--red),var(--amber));"></div>
            </div>

async function fetchCryptoPrices() {
  try {
    const res = await fetch(`${API_BASE}/api/crypto/prices`);
    const json = await res.json();
    if (json.data && json.data.length > 0) {
      json.data.forEach(d => {
        const sym = d.symbol.replace('USDT','');
        const idx = CRYPTO.findIndex(c => c.sym === sym);
        if (idx !== -1) {
          const chg = d.change_pct || 0;
          CRYPTO[idx].price = d.price;
          CRYPTO[idx].chg   = parseFloat(chg.toFixed(2));
          CRYPTO[idx].pos   = chg >= 0;
        }
      });
      renderCrypto();
      renderTicker();
    }
  } catch(e) { console.error('Crypto API error:', e); }
}

async function fetchMacroPulse() {
  try {
    const res = await fetch(`${API_BASE}/api/macro/pulse`);
    const json = await res.json();
    if (json.data) {
      const d = json.data;
      const macroMap = [
        { key:'fed_rate',     label:'Fed Funds Rate', sub:'Target Range' },
        { key:'treasury_10y', label:'10Y Treasury',   sub:'US Benchmark Yield' },
        { key:'cpi',          label:'CPI Inflation',  sub:'Year-over-Year' },
        { key:'unemployment', label:'Unemployment',   sub:'Latest Reading' },
        { key:'vix',          label:'VIX',            sub:'Volatility Index' },
      ];
      macroMap.forEach((m, i) => {
        if (d[m.key] && d[m.key].value) {
          MACRO[i].val = d[m.key].value;
          MACRO[i].chg = d[m.key].date || '--';
        }
      });
      renderMacro();
    }
  } catch(e) { console.error('Macro API error:', e); }
}

async function fetchEquityHeatmap() {
  try {
    const res = await fetch(`${API_BASE}/api/equity/heatmap`);
    const json = await res.json();
    if (json.data) {
      SP500_TICKERS.forEach(t => {
        if (json.data[t.s] !== undefined) t.p = json.data[t.s];
      });
      renderHeatmap();
    }
  } catch(e) { console.error('Equity heatmap error:', e); }
}

async function fetchIndices() {
  try {
    const res = await fetch(`${API_BASE}/api/equity/indices`);
    const json = await res.json();
    if (json.data && json.data.length > 0) {
      json.data.forEach((d, i) => {
        if (i < INDICES.length) {
          INDICES[i].val = d.val;
          INDICES[i].chg = d.chg;
          INDICES[i].pct = d.pct;
          INDICES[i].pos = d.pos;
          INDICES[i].sym = d.sym;
        }
      });
      renderIndices();
    }
  } catch(e) { console.error('Indices API error:', e); }
}

async function fetchForex() {
  try {
    const res = await fetch(`${API_BASE}/api/macro/forex`);
    const json = await res.json();
    if (json.data) {
      FOREX_BIG.forEach(f => {
        const d = json.data[f.key];
        if (d && d.price) {
          f.rate = f.key === 'USDJPY' ? d.price.toFixed(2) : d.price.toFixed(4);
          f.chg  = (d.change_pct >= 0 ? '+' : '') + d.change_pct.toFixed(2) + '%';
          f.pos  = d.change_pct >= 0;
        }
      });
      FOREX_SMALL = FOREX_BIG.slice(0, 4);
      renderForex();
      renderForexBig();
    }
  } catch(e) { console.warn('Forex fetch failed', e); }
}

async function fetchCommodities() {
  try {
    const res = await fetch(`${API_BASE}/api/macro/commodities`);
    const json = await res.json();
    if (json.data) {
      COMMODITIES.forEach(c => {
        const d = json.data[c.key];
        if (d && d.price) {
          c.rate = '$' + d.price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
          c.chg  = (d.change_pct >= 0 ? '+' : '') + d.change_pct.toFixed(2) + '%';
          c.pos  = d.change_pct >= 0;
        }
      });
      renderForex();
    }
  } catch(e) { console.warn('Commodities fetch failed', e); }
}

function fmt(n) {
  if (!n || n === 0) return '--';
  if (n >= 1000) return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if (n < 1) return n.toFixed(4);
  return n.toFixed(2);
}

function colorForPct(pct) {
  const abs = Math.abs(pct);
  if (pct > 0) {
    if (abs > 3)   return '#006644';
    if (abs > 1.5) return '#005535';
    if (abs > 0.5) return '#00442A';
    return '#003322';
  } else {
    if (abs > 3)   return '#7A1020';
    if (abs > 1.5) return '#641018';
    if (abs > 0.5) return '#4E0C14';
    return '#3C0A10';

function renderTicker() {
  const items = CRYPTO.map(c => ({
    sym: c.sym, price: '$' + fmt(c.price),
    chg: (c.pos?'+':'') + c.chg + '%', pos: c.pos
  }));
  const doubled = [...items, ...items];
  document.getElementById('tickerTrack').innerHTML = doubled.map(t => `
    <div class="ticker-item">
      <span class="ticker-sym">${t.sym}</span>
      <span class="ticker-price">${t.price}</span>
      <span class="ticker-chg ${t.pos?'pos':'neg'}">${t.chg}</span>
    </div>
  `).join('');
}

function getMarketStatus() {
  const now = new Date();
  const utcH = now.getUTCHours();
  const utcM = now.getUTCMinutes();
  const utcDay = now.getUTCDay(); // 0=Sun, 6=Sat
  const utcMins = utcH * 60 + utcM;
  const isWeekday = utcDay >= 1 && utcDay <= 5;

  // NYSE/NASDAQ: 14:30-21:00 UTC Mon-Fri
  const nyseOpen = 14 * 60 + 30;
  const nyseClose = 21 * 60;
  const nysePreOpen = 14 * 60;

  let nyseStatus = 'closed';
  let nyseTime = 'Closed';
  if (isWeekday) {
    if (utcMins >= nyseOpen && utcMins < nyseClose) {
      nyseStatus = 'open';
      const minsLeft = nyseClose - utcMins;
      nyseTime = 'Closes in ' + Math.floor(minsLeft/60) + 'h ' + (minsLeft%60) + 'm';
    } else if (utcMins >= nysePreOpen && utcMins < nyseOpen) {
      nyseStatus = 'pre';
      const minsLeft = nyseOpen - utcMins;
      nyseTime = 'Opens in ' + minsLeft + 'm';
    } else if (utcMins < nysePreOpen) {
      const minsLeft = nysePreOpen - utcMins;
      nyseTime = 'Pre-open in ' + Math.floor(minsLeft/60) + 'h ' + (minsLeft%60) + 'm';
    } else {
      nyseTime = 'Opens tomorrow 09:30 ET';
    }
  } else {
    nyseTime = 'Opens Monday 09:30 ET';
  }

  // LSE: 08:00-16:30 UTC Mon-Fri
  const lseOpen = 8 * 60;
  const lseClose = 16 * 60 + 30;
  let lseStatus = 'closed';
  let lseTime = 'Closed';
  if (isWeekday) {
    if (utcMins >= lseOpen && utcMins < lseClose) {
      lseStatus = 'open';
      const minsLeft = lseClose - utcMins;
      lseTime = 'Closes in ' + Math.floor(minsLeft/60) + 'h ' + (minsLeft%60) + 'm';
    } else if (utcMins < lseOpen) {
      const minsLeft = lseOpen - utcMins;
      lseStatus = 'pre';
      lseTime = 'Opens in ' + Math.floor(minsLeft/60) + 'h ' + (minsLeft%60) + 'm';
    } else {
      lseTime = 'Opens tomorrow 08:00 UTC';
    }
  } else {
    lseTime = 'Opens Monday 08:00 UTC';
  }

  // TSE: 00:00-06:00 UTC Mon-Fri (09:00-15:00 JST)
  const tseOpen = 0;
  const tseClose = 6 * 60;
  let tseStatus = 'closed';
  let tseTime = 'Closed';
  if (isWeekday) {
    if (utcMins >= tseOpen && utcMins < tseClose) {
      tseStatus = 'open';
      const minsLeft = tseClose - utcMins;
      tseTime = 'Closes in ' + Math.floor(minsLeft/60) + 'h ' + (minsLeft%60) + 'm';
    } else {
      tseTime = 'Opens tomorrow 09:00 JST';
    }
  } else if (utcDay === 1) {
    tseTime = 'Opens Monday 09:00 JST';
  } else {
    tseTime = 'Opens Monday 09:00 JST';
  }

  return { nyseStatus, nyseTime, lseStatus, lseTime, tseStatus, tseTime };
}

async function fetchFearGreed() {
  try {
    const res = await fetch(`${API_BASE}/api/macro/fear-greed`);
    const json = await res.json();
    if (json.score !== null) {
      document.getElementById('fgScore').textContent = json.score.toFixed(0);
      const label = document.getElementById('fgLabel');
      label.textContent = json.rating;
      const score = json.score;
      let color = 'var(--amber)';
      if (score <= 25) color = 'var(--red)';
      else if (score >= 75) color = 'var(--green)';
      label.style.color = color;
      document.getElementById('fgScore').style.color = color;
      const fill = document.getElementById('fgFill');
      if (fill) fill.style.width = score + '%';
      try {
        const cached = JSON.parse(localStorage.getItem('agora_overview_cache') || '{}');
        cached.FG_SCORE = { score, label: json.rating, color };
        localStorage.setItem('agora_overview_cache', JSON.stringify(cached));
      } catch(e) {}
    }
  } catch(e) { console.warn('Fear & Greed fetch failed', e); }
}

async function fetchCryptoChange() {
  const tickers = { BTC: 'BTC-USD', ETH: 'ETH-USD', SOL: 'SOL-USD' };
  for (const [sym, ticker] of Object.entries(tickers)) {
    try {
      const res = await fetch(`${API_BASE}/api/equity/indices`);
      break;
    } catch(e) {}
  }
  try {
    const res = await fetch(`${API_BASE}/api/macro/forex`);
  } catch(e) {}
  // Fetch crypto change from Yahoo Finance via a dedicated call
  try {
    const cryptoTickers = ['BTC-USD', 'ETH-USD', 'SOL-USD'];
    const syms = ['BTC', 'ETH', 'SOL'];
    for (let i = 0; i < cryptoTickers.length; i++) {
      const res = await fetch(`${API_BASE}/api/macro/crypto-change?ticker=${cryptoTickers[i]}`);
      const json = await res.json();
      if (json.change_pct !== null) {
        const idx = CRYPTO.findIndex(c => c.sym === syms[i]);
        if (idx !== -1) {
          CRYPTO[idx].chg = parseFloat(json.change_pct.toFixed(2));
          CRYPTO[idx].pos = json.change_pct >= 0;
        }
      }
    }
    renderCrypto();
    renderTicker();
  } catch(e) { console.warn('Crypto change fetch failed', e); }

let searchTimeout = null;

function isQuestion(q) {
  const qtrimmed = q.trim().toLowerCase();
  const questionWords = ["what", "why", "how", "when", "is", "are", "will", "should", "can", "who", "which", "compare", "explain", "show me", "tell me"];
  return questionWords.some(w => qtrimmed.startsWith(w)) || qtrimmed.includes("?");
}

function navigateToSearch(query) {
  if (isQuestion(query)) {
    window.location.href = "../research/index.html?ai=" + encodeURIComponent(query);
  } else {
    window.location.href = "../research/index.html?symbol=" + query.trim().toUpperCase();
  }
}

function navigateToChart(item) {
  const sym = item.symbol + (item.asset_class === 'crypto' ? 'USDT' : '');
  window.location.href = '../research/index.html?symbol=' + sym;
}

function initSearch_orig() {
  const input = document.getElementById('globalSearch');
  const dropdown = document.getElementById('searchDropdown');

    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault(); input.focus(); input.select();

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrapper')) dropdown.classList.remove('visible');
  });

  input.addEventListener('input', () => {
    const q = input.value.trim();
    activeIdx = -1;
    if (q.length < 1) { dropdown.classList.remove('visible'); return; }
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
      try {
        const resp = await fetch(API_BASE + '/api/screener/search?q=' + encodeURIComponent(q) + '&limit=8');
        const data = await resp.json();
        results = data.results || [];
        if (results.length === 0) {
          dropdown.innerHTML = '<div class="search-empty">No results for "' + q + '"</div>';
        } else {
          dropdown.innerHTML = results.map((r, i) => {
            const color = r.asset_class === 'crypto' ? '#F59E0B' : '#00D4AA';
            const changePct = r.change_pct != null ? (r.change_pct >= 0 ? '+' : '') + r.change_pct.toFixed(2) + '%' : '';
            const changeColor = r.change_pct >= 0 ? '#00E676' : '#FF5252';
            const price = r.price != null ? '$' + r.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '';
            const name = r.company_name !== r.symbol ? r.company_name : (r.sector !== 'Unknown' ? r.sector : '');
            return '<div class="search-result" data-idx="' + i + '">' +
              '<div class="search-result-left">' +
              '<span class="search-result-sym">' + r.symbol + '</span>' +
              '<span class="search-result-name">' + name + '</span>' +
              '</div>' +
              '<div class="search-result-right">' +
              '<span class="search-result-price">' + price + '</span>' +
              (changePct ? '<span style="font-family:var(--mono);font-size:14px;color:' + changeColor + '">' + changePct + '</span>' : '') +
              '<span class="search-result-tag" style="background:' + color + '22;color:' + color + '">' + (r.asset_class || 'stock').toUpperCase() + '</span>' +
              '</div></div>';
          }).join('');
          dropdown.querySelectorAll('.search-result').forEach((el, i) => {
            el.addEventListener('click', () => {
              navigateToChart(results[i]);
              dropdown.classList.remove('visible');
              input.value = '';
            });
          });
        }
        dropdown.classList.add('visible');
      } catch(err) {
        dropdown.innerHTML = '<div class="search-empty">Search unavailable</div>';
        dropdown.classList.add('visible');
      }
    }, 200);
  });

  input.addEventListener('keydown', e => {
    const items = dropdown.querySelectorAll('.search-result');
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); }
    else if (e.key === 'Enter' && activeIdx >= 0) { navigateToChart(results[activeIdx]); dropdown.classList.remove('visible'); input.value = ''; }
    else if (e.key === 'Enter' && activeIdx < 0) {
      const q = input.value.trim();
      if (q) { dropdown.classList.remove('visible'); input.value = ''; navigateToSearch(q); }
    }
    else if (e.key === 'Escape') { dropdown.classList.remove('visible'); input.value = ''; }
  });
}

function initSearch() {
  initSearch_orig();
  // Update placeholder to signal smart routing
  const input = document.getElementById('globalSearch');
  if (input) input.placeholder = 'Search any ticker, or ask a question... (Enter to go)';
}

async function init() {
  // Restore cached values instantly before any API calls
  try {
    const cached = localStorage.getItem('agora_overview_cache');
    if (cached) {
      const c = JSON.parse(cached);
      if (c.INDICES) { INDICES.forEach((idx,i) => { if(c.INDICES[i]) Object.assign(idx, c.INDICES[i]); }); }
      if (c.CRYPTO)  { CRYPTO.forEach((cr,i)  => { if(c.CRYPTO[i])  Object.assign(cr,  c.CRYPTO[i]);  }); }
      if (c.FOREX_BIG) { FOREX_BIG.forEach((f,i) => { if(c.FOREX_BIG[i]) Object.assign(f, c.FOREX_BIG[i]); }); FOREX_SMALL = FOREX_BIG.slice(0,4); }
      if (c.COMMODITIES) { COMMODITIES.forEach((cm,i) => { if(c.COMMODITIES[i]) Object.assign(cm, c.COMMODITIES[i]); }); }
      if (c.MACRO) { MACRO.forEach((m,i) => { if(c.MACRO[i]) Object.assign(m, c.MACRO[i]); }); }
      if (c.SP500_TICKERS) { SP500_TICKERS.forEach((t,i) => { if(c.SP500_TICKERS[i]) t.p = c.SP500_TICKERS[i].p; }); renderHeatmap(); }
      if (c.FG_SCORE) {
        document.getElementById('fgScore').textContent = c.FG_SCORE.score;
        document.getElementById('fgScore').style.color = c.FG_SCORE.color;
        document.getElementById('fgLabel').textContent = c.FG_SCORE.label;
        document.getElementById('fgLabel').style.color = c.FG_SCORE.color;
        document.getElementById('fgFill').style.width = c.FG_SCORE.score + '%';
      }
    }
  } catch(e) {}

  // Render immediately with cached or default values
  renderTicker();
  renderIndices();
  renderHeatmap();
  renderMacro();
  renderCrypto();
  renderForex();
  renderForexBig();
  renderSignals();
  updateClock();

  // Fetch fresh data in background
  await fetchCryptoPrices();
  await fetchMacroPulse();
  fetchEquityHeatmap();
  await fetchIndices();
  await fetchForex();
  await fetchCommodities();

  // Save to cache after fresh data loaded
  try {
    localStorage.setItem('agora_overview_cache', JSON.stringify({
      INDICES, CRYPTO, FOREX_BIG, COMMODITIES, MACRO, SP500_TICKERS
    }));
  } catch(e) {}

  initSearch();
  setInterval(updateClock, 1000);
  setInterval(fetchCryptoPrices, 5000);
  setInterval(fetchMacroPulse, 60000);
  setInterval(fetchEquityHeatmap, 300000);
  setInterval(fetchIndices, 60000);
  setInterval(fetchForex, 60000);
  setInterval(fetchCommodities, 60000);
  setInterval(fetchFearGreed, 300000);
  fetchFearGreed();

  // Update cache every 60s
  setInterval(() => {
    try {
      localStorage.setItem('agora_overview_cache', JSON.stringify({
        INDICES, CRYPTO, FOREX_BIG, COMMODITIES, MACRO
      }));
    } catch(e) {}
  }, 60000);
}

init();
document.addEventListener('DOMContentLoaded', initSearch);
if (document.readyState !== 'loading') initSearch();
  function signOut() {
    localStorage.removeItem('agora_token');
    localStorage.removeItem('agora_user');
    window.location.href = '../auth/index.html';
  }
  (function() {
    const user = JSON.parse(localStorage.getItem('agora_user') || 'null');
    if (user) {
      document.getElementById('user-nav').style.display = 'flex';
      document.getElementById('user-email').textContent = user.email;
    } else {
      document.getElementById('signin-nav').style.display = 'block';
    }
  })();
</script>
